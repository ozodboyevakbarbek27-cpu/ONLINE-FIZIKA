
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORNO UC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif}
header{padding:25px 18px;text-align:center;background:linear-gradient(135deg,#171d35,#10111b);border-bottom:1px solid #292e43}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;color:#ffd34e}
header p{color:#aab0c5;font-size:13px}
main{max-width:480px;margin:auto;padding:18px}
.card{background:#151927;border:1px solid #292f43;border-radius:17px;padding:18px;margin-bottom:16px}
h3{margin:0 0 15px;font-size:17px}
label{display:block;color:#b9bfd1;font-size:13px;margin:12px 0 7px}
select,input{width:100%;padding:14px;border-radius:10px;border:1px solid #343b51;background:#0d111c;color:white;font-size:15px}
.price{font-size:25px;font-weight:bold;color:#ffd34e;margin-top:14px}
.info{color:#aeb5c9;font-size:13px;line-height:1.6}
button{width:100%;padding:15px;border:0;border-radius:11px;background:#ffd34e;color:#171717;font-size:16px;font-weight:bold;margin-top:14px}
button:disabled{opacity:.5}
#preview{display:none;max-width:100%;max-height:220px;margin-top:12px;border-radius:10px}
#status{font-size:13px;line-height:1.5;margin-top:12px;color:#ffd34e}
footer{text-align:center;color:#747c91;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="logo">PORNO UC</div>
  <p>PUBG Mobile UC TOP-UP</p>
</header>

<main>
  <section class="card">
    <h3>UC paketini tanlang</h3>
    <label>UC miqdori</label>
    <select id="package">
      <option value="60" data-price="12000">60 UC — 12 000 so‘m</option>
      <option value="325" data-price="60000">325 UC — 60 000 so‘m</option>
      <option value="660" data-price="120000">660 UC — 120 000 so‘m</option>
      <option value="1800" data-price="300000">1800 UC — 300 000 so‘m</option>
    </select>
    <div class="price" id="price">12 000 so‘m</div>
    <label>PUBG Mobile ID</label>
    <input id="playerId" type="text" placeholder="O‘yin ID raqamingiz">
  </section>

  <section class="card">
    <h3>To‘lov ma’lumotlari</h3>
    <p class="info">Karta raqami:</p>
    <div style="font-size:21px;font-weight:bold;letter-spacing:1px">1111 1111 1111 1111</div>
    <p class="info">Karta egasi: A.O.</p>
    <p class="info">To‘lovni amalga oshirgach, chek rasmini quyida yuklang.</p>
  </section>

  <section class="card">
    <h3>To‘lov chekini yuborish</h3>
    <label>Chek rasmi</label>
    <input id="receipt" type="file" accept="image/*">
    <img id="preview" alt="Chek rasmi ko‘rinishi">
    <button id="send">Buyurtmani yuborish</button>
    <div id="status"></div>
  </section>
</main>

<footer>PORNO UC • Buyurtmalar admin tekshiruvidan o‘tadi</footer>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const pack = document.getElementById("package");
const price = document.getElementById("price");
const receipt = document.getElementById("receipt");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");

function updatePrice(){
  const option = pack.options[pack.selectedIndex];
  price.textContent = Number(option.dataset.price).toLocaleString("uz-UZ")+" so‘m";
}
pack.addEventListener("change",updatePrice);

receipt.addEventListener("change",()=>{
  const file=receipt.files[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){
    statusBox.textContent="Faqat rasm faylini tanlang.";
    receipt.value="";
    return;
  }
  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
});

document.getElementById("send").addEventListener("click",async()=>{
  const playerId=document.getElementById("playerId").value.trim();
  const file=receipt.files[0];
  const option=pack.options[pack.selectedIndex];

  if(!playerId){statusBox.textContent="PUBG ID raqamingizni kiriting.";return;}
  if(!file){statusBox.textContent="Chek rasmini tanlang.";return;}

  const user=tg?.initDataUnsafe?.user;
  if(!user?.id){
    statusBox.textContent="Mini App'ni Telegram ichidan oching.";
    return;
  }

  const order={
    telegram_user_id:user.id,
    telegram_username:user.username||"",
    player_id:playerId,
    uc:pack.value,
    amount:option.dataset.price
  };

  statusBox.textContent=
    "Buyurtma ma’lumotlari tayyor. Chekni adminga yuborish uchun backend ulanishi hali sozlanmagan.";

  console.log("Order data:",order);
  tg?.HapticFeedback?.notificationOccurred("success");
});
</script>
</body>
</html>
