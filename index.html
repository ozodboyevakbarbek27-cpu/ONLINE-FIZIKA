function setAv(e,ph,tx){e.style.backgroundImage=ph?`url(${ph})`:'none';e.textContent=ph?'':tx}
function setLang(v){lang=v;sv('lg',v);ap()}
function togS(){sv('snd',ld('snd',1)?0:1);ap()}
function openGuide(){gi=0;gd();show('gd')}
function menuP(){$('mn').textContent=P.name;setAv($('mav'),P.photo,P.name[0]||'?');const r=ld('rec',{})[P.name]||{w:0,d:0,l:0};$('ms').textContent=`🏆 ${r.w}  🤝 ${r.d}  ❌ ${r.l}`}
function ap(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('ri').placeholder=t('code');$('pn').placeholder=t('name');$('ci').placeholder=t('chat');$('lg').value=lang;$('sb').textContent=ld('snd',1)?'🔊':'🔇';document.documentElement.lang=lang;menuP();if(G){if(G.mode==='bot')$('opn').textContent=t('l'+G.lvl);after(1)}}
function show(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id===id));if(id==='m'){if(!G&&NET){closeNet();$('rm').style.display='none'}menuP()}window.scrollTo(0,0)}
function newG(mode,me){return{st:initSt(),hist:[],mode,me,sel:-1,tg:[],over:false,last:null,opp:'',L:[],ck:false,pid:''}}
function draw(){const bd=$('bd');bd.innerHTML='';const fl=G.me==='b';
for(let i=0;i<64;i++){const s=fl?63-i:i,p=G.st.b[s],d=document.createElement('div'),r=s>>3,c=s&7,isT=G.tg.includes(s);
d.className='q '+((r+c)%2?'d':'l')+(G.sel===s?' sel':'')+(G.last&&(G.last.f===s||G.last.t===s)?' lm':'')+(isT?(p?' tc':' t'):'');
if(i%8===0)d.insertAdjacentHTML('beforeend',`<b>${8-r}</b>`);
if(i>55)d.insertAdjacentHTML('beforeend',`<i>${'abcdefgh'[c]}</i>`);
if(p){const e=document.createElement('span');e.textContent=GL[p.toLowerCase()]+'\uFE0E';e.className='pc '+(isW(p)?'pw':'pb')+(G.last&&G.last.t===s?' pop':'');d.appendChild(e);if(G.ck&&p===(G.st.t==='w'?'K':'k'))d.classList.add('ck')}
d.onclick=()=>tap(s);bd.appendChild(d)}}
function tap(s){if(!G||G.over||G.st.t!==G.me)return;const p=G.st.b[s];
if(G.sel>=0){const m=G.L.find(x=>x.f===G.sel&&x.t===s);if(m)return play(m)}
if(p&&isW(p)===(G.me==='w')){G.sel=s;G.tg=G.L.filter(x=>x.f===s).map(x=>x.t)}else{G.sel=-1;G.tg=[]}draw()}
function play(m,rem){const cap=G.st.b[m.t]||m.e,n=G.hist.length;G.hist.push({f:sq(m.f),t:sq(m.t)});
G.st=mk(G.st,m);G.last=m;G.sel=-1;G.tg=[];snd(cap?'c':'m');
if(G.mode==='on'&&!rem)tx({k:'mv',f:m.f,t:m.t,n});after()}
function hist(){let h='';for(let i=0;i<G.hist.length;i+=2){const a=G.hist[i],b=G.hist[i+1];h+=`${i/2+1}. ⚪ ${a.f}→${a.t}${b?`  ⚫ ${b.f}→${b.t}`:''}<br>`}$('hl').innerHTML=h;$('hl').scrollTop=1e5}
function dots(a,b){$('d1').classList.toggle('on',a);$('d2').classList.toggle('on',b)}
function after(re){const L=legal(G.st),ck=inChk(G.st),my=G.st.t===G.me;G.L=L;G.ck=ck;draw();hist();dots(!my&&!G.over,my&&!G.over);if(G.over)return;
if(!L.length)return ck?endG(my?'l':'w',t('mate')+' '+t(my?'lose':'win')):endG('d',t('stale'));
if(G.st.b.every(p=>!p||/k/i.test(p)))return endG('d',t('stale'));
$('st').textContent=(my?t('me'):t('opp'))+(ck?' · '+t('chk'):'');
if(!re&&G.mode==='bot'&&!my){$('st').textContent='🤖 …';setTimeout(botMove,50)}}
function rec(n,r){const R=ld('rec',{});R[n]=R[n]||{w:0,d:0,l:0};R[n][r]++;sv('rec',R)}
function endG(r,msg){if(G.over)return;G.over=true;$('st').textContent=msg;dots(0,0);snd('e');rec(P.name,r);if(G.mode==='on'&&G.opp)rec(G.opp,{w:'l',l:'w',d:'d'}[r]);
const g=G;setTimeout(()=>{if(G!==g)return;$('oe').textContent={w:'🏆',l:'💔',d:'🤝'}[r];$('ot').textContent=msg;$('oa').style.display=g.mode==='bot'?'':'none';$('ov').classList.add('on')},800)}
function botMove(){const g=G;if(!g||g.over)return;const t0=Date.now(),L=g.L;let m;
if(g.lvl===1)m=L[Math.random()*L.length|0];
else{const w=g.st.t==='w';let best=w?-1e9:1e9,bs=[];
for(const x of L){const v=srch(mk(g.st,x),g.lvl-2,-1e9,1e9);if(v===best)bs.push(x);else if(w?v>best:v<best){best=v;bs=[x]}}
m=bs[Math.random()*bs.length|0]}
setTimeout(()=>{if(G===g&&!g.over&&g.st.t!==g.me)play(m,1)},Math.max(200,1000+Math.random()*500-(Date.now()-t0)))}
function begin(opn,chat){$('ov').classList.remove('on');$('opn').textContent=opn;$('oav').textContent=chat?'👤':'🤖';$('myn').textContent=P.name;setAv($('mav2'),P.photo,P.name[0]||'?');$('tc').style.display=chat?'':'none';$('cl').innerHTML='';tab(0);show('g');after()}
function startBot(l){G=newG('bot','w');G.lvl=l;begin(t('l'+l),0)}
function again(){startBot(G.lvl)}
function tab(i){$('hl').style.display=i?'none':'block';$('cb').style.display=i?'block':'none'}
function resign(){if(!G||G.over)return;if(G.mode==='on')tx({k:'re'});endG('l',t('lose'))}
function leave(){if(G&&G.mode==='on')tx({k:'bye'});closeNet();G=null;$('ov').classList.remove('on');$('rm').style.display='none';show('m')}

// ===== ONLAYN: ommaviy MQTT relay (4 ta broker parallel) =====
function pub(c,o){try{c.publish(c.rm,JSON.stringify({s:MY,...o}),{qos:1})}catch{}}
function tx(o){if(NET&&NET.use)pub(NET.use,o)}
function closeNet(){const n=NET;NET=null;ninfo();if(!n)return;clearInterval(n.iv);setTimeout(()=>n.cs.forEach(c=>{try{c.end()}catch{}}),300)}
function ninfo(){const e=$('ns');if(!e)return;if(!NET){e.style.display='none';return}e.style.display='block';
const bad=NET.cs.find(c=>c.er&&c.msg);e.textContent='📡 '+NET.cs.map(c=>c.nm+(c.up?' ✅':c.er?' ❌':' ⏳')).join(' · ')+(bad&&!NET.cs.some(c=>c.up)?'\n'+bad.nm+': '+String(bad.msg).slice(0,70):'')}
function ntfy(room,onMsg,onUp){const nt='chessuz_v1_'+room,seen=new Set(),c={nm:'ntfy',rm:'',up:0,er:0,msg:'',
publish(tp,p){fetch('https://ntfy.sh/'+nt,{method:'POST',body:p}).catch(e=>{c.msg=String(e&&e.message||e);ninfo()})},
end(){try{c.es.close()}catch{}c.up=0},removeAllListeners(){},on(ev,f){if(ev==='close')c.oc=f}};
try{const es=c.es=new EventSource('https://ntfy.sh/'+nt+'/sse?since=20s');
es.onopen=()=>{c.up=1;c.er=0;ninfo();onUp(c)};
es.onmessage=ev=>{try{const o=JSON.parse(ev.data);if(o.event!=='message'||seen.has(o.id))return;seen.add(o.id);const d=JSON.parse(o.message);if(d&&d.s&&d.s!==MY)onMsg(d,c)}catch{}};
es.onerror=()=>{c.up=0;c.er=1;c.msg='no connection';ninfo();if(es.readyState===2&&c.oc)c.oc()}}catch(e){c.er=1;c.msg=e.message}
return c}
function netStart(room,onMsg,onUp){const N={cs:[],use:null,room,iv:0,tries:0};
N.cs.push(ntfy(room,onMsg,onUp));
if(typeof mqtt==='undefined')N.cs.push({nm:'mqtt',er:1,msg:'library not loaded',end(){}});
else BRK.forEach(u=>{let c;try{c=mqtt.connect(u,{connectTimeout:7000,reconnectPeriod:0,keepalive:20,will:{topic:TOP+room,payload:JSON.stringify({s:MY,k:'bye'}),qos:1}})}catch(e){return}
c.nm=new URL(u).hostname.split('.').slice(-2,-1)[0];c.rm=TOP+room;N.cs.push(c);
c.on('connect',()=>c.subscribe(c.rm,{qos:1},e=>{if(!e){c.up=1;c.er=0;ninfo();onUp(c)}}));
c.on('message',(tp,b)=>{let d;try{d=JSON.parse(b.toString())}catch{return}if(d&&d.s&&d.s!==MY)onMsg(d,c)});
c.on('error',e=>{c.er=1;c.msg=e&&e.message;ninfo()});c.on('close',()=>{c.up=0;ninfo()})});
return N}
function startOn(me,name,pid,c){NET.use=c;NET.cs.forEach(x=>{if(x!==c)try{x.end()}catch{}});clearInterval(NET.iv);
G=newG('on',me);G.pid=pid;G.opp=String(name||'?').slice(0,20);
c.removeAllListeners('close');c.on('close',()=>{c.up=0;if(G&&NET&&NET.use===c&&!G.over){G.over=true;dots(0,0);$('st').textContent=t('neterr')}});
begin(G.opp,1)}
function gmsg(d){if(!G||d.s!==G.pid)return;
if(d.k==='mv'){if(d.n===G.hist.length&&G.st.t!==G.me){const m=G.L.find(x=>x.f===d.f&&x.t===d.t);if(m)play(m,1)}}
else if(d.k==='ch')addC(String(d.x).slice(0,200),0);
else if(d.k==='re'){if(!G.over)endG('w',t('win'))}
else if(d.k==='bye'){if(!G.over)endG('w',t('left'))}}
function host(){closeNet();const code=(Math.random().toString(36)+'00000').slice(2,7).toUpperCase();RC=code;let up=0;
$('rc').textContent=code;$('rm').style.display='block';
const n=netStart(code,(d,c)=>{
if(d.k==='join'){if(!G){startOn('w',d.n,d.s,c);tx({k:'hi',n:P.name})}else if(NET&&c===NET.use){if(d.s===G.pid)tx({k:'hi',n:P.name});else tx({k:'full'})}}
else if(G&&NET&&c===NET.use)gmsg(d)},c=>{up=1});
NET=n;ninfo();setTimeout(()=>{if(!up&&NET===n)toast(t('nobrk'))},9000)}
function join(code){code=(code||'').trim().toUpperCase();if(code.length!==5)return toast(t('norm'));closeNet();toast(t('conn'));
const n=netStart(code,(d,c)=>{
if(!G){if(d.k==='hi')startOn('b',d.n,d.s,c);else if(d.k==='full'){toast(t('full'));closeNet()}}
else if(NET&&c===NET.use)gmsg(d)},c=>pub(c,{k:'join',n:P.name}));
NET=n;ninfo();n.iv=setInterval(()=>{if(G||NET!==n||++n.tries>6){clearInterval(n.iv);if(!G&&NET===n){toast(t(n.cs.some(c=>c.up)?'norm':'nobrk'));closeNet()}return}n.cs.forEach(c=>c.up&&pub(c,{k:'join',n:P.name}))},1500)}
function shareR(){const u=`https://t.me/${BOT}?startapp=${RC}`,l='https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent('♟ '+RC);tg?tg.openTelegramLink(l):window.open(l)}
function addC(x,me){const d=document.createElement('div');d.textContent=(me?P.name:G.opp)+': '+x;$('cl').appendChild(d);$('cl').scrollTop=1e5}
function sendC(){const x=$('ci').value.trim();if(!x||!G||G.mode!=='on')return;tx({k:'ch',x});addC(x,1);$('ci').value=''}

// ===== PROFIL / REYTING / QO‘LLANMA =====
function prof(){$('tgp').style.display=user.photo_url?'':'none';$('pn').value=P.name;$('pi').textContent='ID: '+(user.id||'—');setAv($('av'),P.photo,P.name[0]||'?')}
function saveP(){P.name=$('pn').value.trim().slice(0,20)||P.name;sv('p',P);prof();menuP();toast('✅')}
$('ph').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onerror=()=>toast(t('photoerr'));
r.onload=()=>{const im=new Image();im.onerror=()=>toast(t('photoerr'));im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height);c.width=c.height=128;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);P.photo=c.toDataURL('image/jpeg',.8);sv('p',P);prof();menuP();toast(t('photook'))};im.src=r.result};r.readAsDataURL(f)};
function tgPhoto(){if(user.photo_url){P.photo=user.photo_url;sv('p',P);prof();menuP();toast(t('photook'))}}
function lb(){const e=Object.entries(ld('rec',{})).sort((a,b)=>b[1].w*3+b[1].d-a[1].w*3-a[1].d);$('lt').innerHTML='';
e.slice(0,30).forEach(([n,r],i)=>{const d=document.createElement('div');d.className='card lr';d.innerHTML='<span></span><b></b><span></span>';d.children[0].textContent=['🥇','🥈','🥉'][i]||(i+1)+'.';d.children[1].textContent=n;d.children[2].textContent=`🏆${r.w} 🤝${r.d} ❌${r.l}`;$('lt').appendChild(d)})}
function gd(){$('gt').textContent=GD[lang][gi]+'\n\n'+(gi+1)+' / 5'}
function gp(x){gi=Math.max(0,Math.min(4,gi+x));gd()}

ap();
const sp=tg?.initDataUnsafe?.start_param;if(sp&&/^[A-Za-z0-9]{5}$/.test(sp))join(sp);
